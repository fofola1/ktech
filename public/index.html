<!doctype html>
<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Linktree - KTech</title>
        <link rel="stylesheet" href="./output.css" />
    </head>
    <body class="font-sans text-white">
        <main
            class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10 sm:px-6 lg:px-8"
        >
            <section
                class="glass-card relative z-10 w-full max-w-2xl rounded-[2rem] p-5 sm:p-8 lg:p-10"
            >
                <div
                    class="flex flex-col gap-8 lg:flex-row lg:items-center lg:gap-10"
                >
                    <div
                        class="flex shrink-0 flex-col items-center gap-4 text-center lg:w-56"
                    >
                        <div class="relative">
                            <div
                                class="absolute inset-0 rounded-full bg-brand-blue/35 blur-2xl"
                            ></div>
                            <a href="https://rehacek.tech">
                                <div
                                    class="relative flex h-36 w-36 items-center justify-center overflow-hidden rounded-full border-4 border-white/15 bg-white/10 text-center shadow-2xl shadow-black/40 sm:h-40 sm:w-40"
                                >
                                    <img
                                        src="pfp.jpg"
                                        alt="Profile Picture"
                                        class="h-full w-full object-cover"
                                    />
                                </div>
                            </a>
                        </div>

                        <div class="space-y-2">
                            <a href="https://rehacek.tech">
                                <h1
                                    class="text-3xl font-black tracking-tight text-white sm:text-4xl"
                                >
                                    Filip Řeháček
                                </h1>
                            </a>
                            <p
                                class="max-w-xs text-sm leading-6 text-white/70 sm:text-base"
                            >
                                Data Intelligence AG Student
                            </p>
                        </div>
                    </div>

                    <div class="min-w-0 flex-1 space-y-6">
                        <div id="linktree-sections" class="space-y-6"></div>
                    </div>
                </div>
            </section>
        </main>

        <script>
            String.prototype.format = function () {
                let args = arguments;
                return this.replace(/{(\d+)}/g, function (match, indexStr) {
                    const i = parseInt(indexStr, 10) - 1;
                    return typeof args[i] !== "undefined" ? args[i] : match;
                });
            };

            const linktreeConfig = {
                "K prezentaci": {
                    Shrnutí: "shrnuti.html",
                    "Next steps": "next-steps.html",
                },
                "Kde mě najdeš": {
                    Github: "https://github.com/fofola1",
                    LinkedIn: "https://www.linkedin.com/in/filip-rehacek",
                    Instagram: "https://www.instagram.com/fl0x1c3k_",
                    Email: "mailto:filip@rehacek.tech",
                },
            };

            const sectionsContainer =
                document.getElementById("linktree-sections");

            const sectionEntries = Object.entries(linktreeConfig);
            const btnTemplate = `
                    <a class="link-button group" href="{1}" {2}>
                        <span class="text-base font-semibold sm:text-lg">{3}</span>
                        <svg
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            class="ml-4 h-9 w-9 shrink-0 transition group-hover:translate-x-1"
                            >
                            <path d="M0 0h24v24H0z" fill="none" />
                            <g fill="currentColor">
                                <path d="M14 13.963h2v-6h-6v2h2.586l-5.33 5.33l1.414 1.414l5.33-5.33z" />
                                <path fill-rule="evenodd" d="M1 12C1 5.925 5.925 1 12 1s11 4.925 11 11s-4.925 11-11 11S1 18.075 1 12m2 0a9 9 0 1 1 18 0a9 9 0 0 1-18 0" clip-rule="evenodd" />
                            </g>
                        </svg>
                    </a>
                `;
            const externalLinkAttrs = `target="_blank" rel="noopener noreferrer"`;

            sectionsContainer.innerHTML = sectionEntries
                .map(([sectionName, buttons]) => {
                    const buttonMarkup = Object.entries(buttons)
                        .map(([buttonText, url]) =>
                            btnTemplate.format(
                                url,
                                url.startsWith("http") ? externalLinkAttrs : "",
                                buttonText,
                            ),
                        )
                        .join("");
                    // <span class="ml-4 inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-black/10 bg-black text-white transition group-hover:bg-white group-hover:text-black">↗</span>
                    return `
                <section class="space-y-3">
                    <h2 class="section-title text-white/80">${sectionName}</h2>
                    <div class="space-y-3">${buttonMarkup}</div>
                </section>
            `;
                })
                .join("");
        </script>
    </body>
</html>
